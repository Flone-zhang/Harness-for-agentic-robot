[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessvla"
version = "0.1.0"
description = "Evidence-gated, offline-first Piper task harness"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["robotics", "VLA", "Piper", "PI0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.scripts]
harnessvla = "harnessvla.cli:main"
harnessvla-pi0 = "harnessvla.pi0_deploy:main"
harnessvla-qwen = "harnessvla.qwen_planner:main"
harnessvla-run = "harnessvla.run_config:main"

[tool.setuptools.packages.find]
include = ["harnessvla*"]
